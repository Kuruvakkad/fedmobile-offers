<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FedMobile - Pre-Approved Offers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </div>
        <h1>Pre-Approved Offers</h1>
        <div class="header-action">
            <!-- Debug Toggle -->
            <label class="switch">
              <input type="checkbox" id="debugToggle" checked>
              <span class="slider round"></span>
            </label>
        </div>
    </header>

    <main class="app-content">
        <!-- Offers Container -->
        <div id="offersContainer" class="offers-container">
            <!-- Cards will be injected here via JS -->
        </div>
    </main>

    <!-- Dynamic Offer Modal -->
    <div id="offerModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">
                <!-- Icon injected by JS -->
            </div>
            <h3 id="modalTitle">Offer Title</h3>
            <div id="modalBody" class="modal-body-content">
                <!-- Text and details injected by JS -->
            </div>
            <div class="modal-actions">
                <button id="modalCancelBtn" class="btn btn-secondary">Close</button>
                <button id="modalCtaBtn" class="btn btn-primary">Apply Now</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toastMsg">Action logged</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
